[package]
name = "mcpg-plugin-backend-llm-stability"
version = "0.1.0-alpha.19"
license = "Apache-2.0"
edition = "2024"
description = """
Stability AI Stable Image (v2beta) image-generation binding plugin
for MCPG. Ships `StabilityImagePlugin` (kind: `stability.image`).

Targets the public Stable Image API at
`https://api.stability.ai/v2beta/stable-image/generate/{core,sd3,ultra}`.
The route is selected via the operator-facing `model` field
(`core` | `sd3` | `ultra`) — Stability's three SKUs are exposed as
the "model" surface so a tool definition stays consistent with the
OpenAI/Gemini image plugins.

Wire format is multipart/form-data (NOT JSON). The `Accept:
application/json` header asks Stability to base64-encode the image
into a small JSON envelope so the engine has bytes in hand for the
gateway's `ContentStore` push without a follow-up HTTP fetch.
"""

[lib]
# cdylib: the .so the gateway's native_loader dlopens. rlib: keeps the
# in-tree unit/integration tests + the gateway's current static path
# (StabilityImagePlugin::new in app/mod.rs) building. The
# backend-plugin-migration adds the cdylib surface additively; the
# gateway stays on the static path for now.
crate-type = ["cdylib", "rlib"]

[features]
# Default OFF so the workspace build (which links the gateway bin
# against this crate as an rlib) does not emit `mcpg_plugin_register`
# and collide with the other plugin rlibs. Standalone cdylib builds
# (nx docker:build / OCI publish) opt in via `--features cdylib-export`.
default = []
cdylib-export = []
# Declared empty so the SDK macro's `register_static` accessor
# (`#[cfg(feature = "static-firstparty")]`) stays gated OFF here and
# does not trip `unexpected_cfgs`. The crate is consumed via the
# gateway's own manual registration block today, NOT through the SDK
# macro's static-firstparty path. (Note: the SDK *dependency* below
# still enables its own `static-firstparty` feature — that is a
# separate flag gating the SDK's `plugin_host` re-export, not this
# crate's `register_static` emission.)
static-firstparty = []

[dependencies]
tokio-util = "0.7"
mcpg-backend-llm-shared = { git = "https://github.com/mcpg-dev/mcpg-backend-llm-shared", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
mcpg-sensitive = { git = "https://github.com/mcpg-dev/mcpg-sensitive", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17", features = ["static-firstparty"] }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
metrics = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `rt-multi-thread` powers the cdylib sync bridge's private runtime
# (`Builder::new_multi_thread`); the rest cover the async adapter logic
# shared with the static path.
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tower = "0.5"
