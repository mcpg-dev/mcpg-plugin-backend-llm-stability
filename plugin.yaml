schema: mcpg.dev/plugin/v1
id: dev.mcpg.backend.llm.stability
name: Stability AI Image Generation Backend
license: Apache-2.0
description: |
  Cdylib descriptor for the Stability AI backend plugin. Ships a single
  `backend` entity (image) under one cdylib. The entity self-describes
  its real kind (`stability.image`) at runtime via its `manifest()`
  slot, so the host dispatches to the right binding.

  The static-firstparty path keeps using the per-kind `plugin.*.yaml`
  descriptors + the gateway's manual registration block; this single
  descriptor is for the native-cdylib loader only.
class: backend
runtime: native-cdylib-v1
protocol_version: "1.0"
required_capabilities: [network_outbound]
